onboarding = false

[theme]
name = "one-dark"

[terminal]
default_shell = "/bin/zsh"
new_cwd = "follow"

[ui]
tab_bar_position = "top"
mouse_capture = true
copy_on_select = true
pane_gaps = false

[session]
resume_agents_on_restore = true

[keys]
# Prefix key
prefix = "ctrl+b"

# Config reload (tmux: bind r)
reload_config = "prefix+r"

# Pane splitting (tmux: bind / and bind -)
split_vertical = "prefix+/"
split_horizontal = "prefix+minus"

# Pane movement: disabled built-in direct focus so Vim-aware navigation handles ctrl+h/j/k/l
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# Pane resizing (tmux: bind H, J, K, L)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

# Tab / Window navigation (tmux: bind C-h and C-k)
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+k"
switch_tab = "prefix+1..9"

# Copy mode (tmux: bind Escape)
copy_mode = "prefix+esc"

# Vim-aware pane navigation (move between Neovim splits first, Herdr panes at edges)
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-navigator.left"
description = "Vim-aware pane left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-navigator.down"
description = "Vim-aware pane down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-navigator.up"
description = "Vim-aware pane up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-navigator.right"
description = "Vim-aware pane right"

# Clear pane (tmux: bind C-l)
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "herdr pane send-keys \"$HERDR_ACTIVE_PANE_ID\" ctrl+l"
description = "Clear pane"

# Launch luceda-dev workspace session
[[keys.command]]
key = "prefix+alt+l"
type = "shell"
command = "herdr-luceda"
description = "Launch or focus luceda-dev workspace"

